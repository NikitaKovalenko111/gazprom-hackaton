host: localhost:3001
info:
  contact: {}
  description: API шлюз для оркестрации запросов к аналитическому и LLM сервисам.
  title: Gazprom Hackaton Gateway API
  version: "1.0"
paths:
  /api/v1/form:
    post:
      consumes:
      - application/json
      description: Принимает конфигурацию проекта от клиента, запрашивает инфраструктурные
        метрики и возвращает обработанные данные.
      parameters:
      - description: Данные клиентской формы
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.FormResponse'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            items:
              $ref: '#/definitions/models.ScoredPlace'
            type: array
        "400":
          description: Неверный формат JSON входных данных
          schema:
            properties:
              error:
                type: string
              message:
                type: string
            type: object
        "500":
          description: Ошибка работы внутреннего микросервиса
          schema:
            properties:
              error:
                type: string
              message:
                type: string
            type: object
      summary: Обработка формы
      tags:
      - form
  /api/v1/genpres:
    post:
      consumes:
      - application/json
      description: Принимает обработанную конфигурацию проекта от клиента и LLM генерирует
        презентацию.
      parameters:
      - description: Данные для генерации презентации
        in: body
        name: body
        required: true
        schema:
          items:
            $ref: '#/definitions/models.ScoredPlace'
          type: array
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.LLMResponse'
        "400":
          description: Неверный формат JSON входных данных
          schema:
            properties:
              error:
                type: string
              message:
                type: string
            type: object
        "500":
          description: Ошибка работы внутреннего микросервиса или LLM
          schema:
            properties:
              error:
                type: string
              message:
                type: string
            type: object
      summary: Генерация презентации
      tags:
      - form
  /api/v1/llm:
    post:
      consumes:
      - application/json
      description: Принимает обработанную конфигурацию проекта от клиента и генерирует
        рекомендацию от LLM.
      parameters:
      - description: Данные для генерации рекомендации
        in: body
        name: body
        required: true
        schema:
          items:
            $ref: '#/definitions/models.ScoredPlace'
          type: array
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.LLMResponse'
        "400":
          description: Неверный формат JSON входных данных
          schema:
            properties:
              error:
                type: string
              message:
                type: string
            type: object
        "500":
          description: Ошибка работы внутреннего микросервиса или LLM
          schema:
            properties:
              error:
                type: string
              message:
                type: string
            type: object
      summary: Генерация рекомендации
      tags:
      - form
  /health:
    get:
      description: Возвращает 200 OK, если шлюз запущен и работает.
      produces:
      - text/plain
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Проверка работоспособности
      tags:
      - system
swagger: "2.0"
